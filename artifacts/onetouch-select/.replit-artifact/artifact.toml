kind = "mobile"
previewPath = "/"
title = "OneTouch Select"
version = "1.0.0"
id = "artifacts/onetouch-select"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25828

[services.development]
run = "pnpm --filter @workspace/onetouch-select run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onetouch-select", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/onetouch-select", "run", "serve" ]

[services.env]
PORT = "25828"
BASE_PATH = "/"
